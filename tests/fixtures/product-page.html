<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <title>測試機能上衣</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "測試機能上衣",
        "brand": {"@type": "Brand", "name": "Fixture Brand"},
        "description": "用於本機端到端測試，不代表真實商品宣稱。",
        "sku": "FIXTURE-001",
        "material": "再生聚酯纖維",
        "offers": {
          "@type": "Offer",
          "price": "1280",
          "priceCurrency": "TWD",
          "availability": "https://schema.org/InStock"
        },
        "additionalProperty": [
          {"@type": "PropertyValue", "name": "版型", "value": "標準版型"}
        ]
      }
    </script>
  </head>
  <body>
    <main>
      <h1>測試機能上衣</h1>
      <p>這是本機回歸測試頁，用來確認商品名稱、品牌、材質、售價、幣別、供貨狀態與規格欄位能被完整保存。這些文字只屬於測試資料，不代表真實商品宣稱，也不會被拿去建立正式廣告。</p>
      <p>測試流程會先保存原始頁面，再讀取結構化商品資料，為每個欄位建立證據編號、來源網址、欄位位置與擷取時間。價格與供貨狀態會標記為容易變動的資料，後續產生文案前仍需要人工確認。</p>
      <p>商品規格本身不等於獨特賣點。只有資料來源支持的內容才能成為商品事實；功能利益、使用情境與購買理由屬於後續推理層，必須清楚標記，不能反過來冒充頁面上的原始證據。</p>
    </main>
  </body>
</html>
